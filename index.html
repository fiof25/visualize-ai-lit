<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>orbs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cactus+Classical+Serif&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #EDE7D8; cursor: crosshair; }
    canvas { display: block; }
    #cursor {
      position: fixed; border-radius: 50%; pointer-events: none; z-index: 200;
      transform: translate(-50%, -50%);
      width: 5px; height: 5px;
      background: rgba(60, 45, 25, 0.28);
      transition: width .20s ease, height .20s ease;
    }
    #cursor.big { width: 28px; height: 28px; background: rgba(60, 45, 25, 0.07); }

    #enter-btn {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 15px 27px;
      border: 0.5px solid black;
      border-radius: 38px;
      cursor: pointer;
      background: transparent;
      color: black;
      font-size: 18px;
      white-space: nowrap;
      text-decoration: none;
      transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
    }
    #enter-btn:hover {
      background: black;
      color: #f3ede0;
      border-color: #f3ede0;
    }
    #enter-btn .btn-label {
      font-family: 'Cactus Classical Serif', Georgia, serif;
      font-weight: 400;
    }
    #enter-btn .btn-arrow {
      font-family: -apple-system, 'SF Pro Text', sans-serif;
      font-size: 16px;
    }

    body.grid-mode { cursor: default; }
    body.grid-mode canvas { cursor: pointer; }

    #story-panel {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 150;
      background: rgba(30, 24, 16, 0.72);
      backdrop-filter: blur(6px);
      align-items: center;
      justify-content: center;
    }
    #story-panel.open { display: flex; }
    #story-inner {
      background: #f3ede0;
      border-radius: 20px;
      padding: 48px 56px;
      max-width: 520px;
      width: 90%;
      position: relative;
      font-family: 'Cactus Classical Serif', Georgia, serif;
      color: #1e1810;
    }
    #story-inner h2 {
      font-size: 24px;
      font-weight: 400;
      margin-bottom: 16px;
    }
    #story-inner p {
      font-size: 15px;
      line-height: 1.7;
      font-family: -apple-system, sans-serif;
      color: #555;
    }
    #story-close {
      position: absolute;
      top: 18px; right: 22px;
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: #888;
      line-height: 1;
    }
    #story-close:hover { color: #1e1810; }

    #blob-tooltip {
      position: fixed;
      z-index: 120;
      pointer-events: none;
      background: #f3ede0;
      border-radius: 14px;
      padding: 14px 18px;
      max-width: 200px;
      box-shadow: 0 4px 24px rgba(30, 24, 16, 0.14);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.18s ease, transform 0.18s ease;
    }
    #blob-tooltip.visible {
      opacity: 1;
      transform: translateY(0);
    }
    #blob-tooltip .tip-title {
      font-family: 'Cactus Classical Serif', Georgia, serif;
      font-size: 14px;
      color: #1e1810;
      margin-bottom: 5px;
    }
    #blob-tooltip .tip-body {
      font-family: -apple-system, sans-serif;
      font-size: 12px;
      line-height: 1.5;
      color: #888;
    }

    /* ── SHARE BUTTON ──────────────────────────────────────────────────────── */
    #share-btn {
      position: fixed;
      top: 24px;
      right: 28px;
      z-index: 100;
      display: none;
      align-items: center;
      gap: 9px;
      padding: 13px 24px;
      border: 0.5px solid rgba(60, 45, 25, 0.6);
      border-radius: 38px;
      cursor: pointer;
      background: transparent;
      color: #1e1810;
      font-size: 15px;
      white-space: nowrap;
      font-family: 'Cactus Classical Serif', Georgia, serif;
      font-weight: 400;
      transition: background 0.25s ease, color 0.25s ease,
                  border-color 0.25s ease, opacity 0.5s ease,
                  transform 0.5s ease;
      opacity: 0;
      transform: translateY(-8px);
    }
    #share-btn.visible { opacity: 1; transform: translateY(0); }
    #share-btn:hover { background: #1e1810; color: #f3ede0; border-color: #1e1810; }
    #share-btn .btn-arrow { font-size: 13px; }

    /* ── STORY FORM OVERLAY ────────────────────────────────────────────────── */
    #story-form-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(30, 24, 16, 0.28);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #story-form-overlay.open { opacity: 1; pointer-events: auto; }
    #form-card {
      position: relative;
      background: #f3ede0;
      border-radius: 24px;
      padding: 52px 60px 48px;
      width: min(580px, 92vw);
      box-shadow: 0 8px 48px rgba(30, 24, 16, 0.18);
    }
    #form-progress {
      display: flex;
      gap: 10px;
      margin-bottom: 36px;
    }
    .step-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: rgba(60, 45, 25, 0.18);
      transition: background 0.4s ease, transform 0.4s ease;
    }
    .step-dot.active { background: rgba(60, 45, 25, 0.70); transform: scale(1.4); }

    #form-well {
      position: relative;
    }
    .form-step {
      display: none;
      flex-direction: column;
      gap: 30px;
      transition: opacity 0.28s ease;
    }
    .form-step.active { display: flex; }

    .form-prompt {
      font-family: 'Cactus Classical Serif', Georgia, serif;
      font-size: clamp(22px, 4vw, 34px);
      font-weight: 400;
      color: #1e1810;
      line-height: 1.35;
      min-height: 2.8em;
    }
    .form-prompt .caret {
      display: inline-block;
      width: 2px; height: 0.85em;
      background: #b07a50;
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0; } }

    .form-field {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(60, 45, 25, 0.25);
      padding: 10px 4px;
      font-size: 18px;
      font-family: -apple-system, sans-serif;
      color: #1e1810;
      outline: none;
      transition: border-color 0.3s ease;
      caret-color: #b07a50;
    }
    .form-field:focus { border-bottom-color: rgba(60, 45, 25, 0.65); }
    .form-field::placeholder { color: rgba(60, 45, 25, 0.28); font-style: italic; }
    .form-textarea {
      resize: none;
      height: 130px;
      border: 1px solid rgba(60, 45, 25, 0.25);
      border-radius: 4px;
      padding: 12px;
      line-height: 1.65;
      background-image: repeating-linear-gradient(
        transparent,
        transparent calc(1.65em - 1px),
        rgba(60, 45, 25, 0.06) calc(1.65em - 1px),
        rgba(60, 45, 25, 0.06) 1.65em
      );
      background-size: 100% 1.65em;
    }
    .form-textarea:focus { border-color: rgba(60, 45, 25, 0.55); }
    .form-hint {
      font-family: -apple-system, sans-serif;
      font-size: 12px;
      color: rgba(60, 45, 25, 0.38);
      margin-top: -18px;
      font-style: italic;
    }

    .form-nav { display: flex; gap: 16px; align-items: center; }
    .form-nav.center { justify-content: center; }
    .back-btn {
      background: none; border: none; cursor: pointer;
      font-family: -apple-system, sans-serif;
      font-size: 13px; color: rgba(60, 45, 25, 0.40); padding: 0;
      transition: color 0.2s ease;
    }
    .back-btn:hover { color: #1e1810; }
    .next-btn {
      margin-left: auto;
      padding: 11px 26px;
      border: 0.5px solid rgba(60, 45, 25, 0.5);
      border-radius: 38px;
      background: transparent;
      cursor: pointer;
      font-family: 'Cactus Classical Serif', Georgia, serif;
      font-size: 15px; color: #1e1810;
      transition: background 0.25s ease, color 0.25s ease;
    }
    .next-btn:hover { background: #1e1810; color: #f3ede0; }

    #submit-story-btn {
      padding: 15px 32px;
      border: 0.5px solid rgba(60, 45, 25, 0.5);
      border-radius: 38px;
      background: transparent; cursor: pointer;
      font-family: 'Cactus Classical Serif', Georgia, serif;
      font-size: 16px; color: #1e1810;
      transition: background 0.25s ease, color 0.25s ease,
                  transform 0.5s ease, box-shadow 0.5s ease;
    }
    #submit-story-btn:hover { background: #1e1810; color: #f3ede0; }
    #submit-story-btn.submitting {
      transform: scale(1.06);
      box-shadow: 0 0 0 10px rgba(176, 122, 80, 0.16),
                  0 0 0 22px rgba(176, 122, 80, 0.07);
    }

    #story-preview-card {
      background: #f3ede0;
      border-radius: 16px;
      padding: 28px 32px;
      display: flex; flex-direction: column; gap: 10px;
      box-shadow: 0 2px 18px rgba(30, 24, 16, 0.09);
    }
    #preview-title-display {
      font-family: 'Cactus Classical Serif', Georgia, serif;
      font-size: 18px; color: #1e1810;
    }
    #preview-body-display {
      font-family: -apple-system, sans-serif;
      font-size: 14px; line-height: 1.7; color: #666;
      white-space: pre-wrap;
    }
    #preview-author-display {
      font-family: -apple-system, sans-serif;
      font-size: 12px; color: rgba(60, 45, 25, 0.42);
      margin-top: 4px; font-style: italic;
    }

    #form-close {
      position: absolute; top: 20px; right: 24px;
      background: none; border: none;
      font-size: 22px; cursor: pointer;
      color: rgba(60, 45, 25, 0.30); line-height: 1;
      transition: color 0.2s ease;
    }
    #form-close:hover { color: #1e1810; }
  </style>
</head>
<body>
<div id="cursor"></div>
<a id="enter-btn" href="#">
  <span class="btn-label">Enter Platform</span>
  <span class="btn-arrow">→</span>
</a>

<div id="blob-tooltip">
  <div class="tip-title" id="tip-title"></div>
  <div class="tip-body" id="tip-body"></div>
</div>

<div id="story-panel">
  <div id="story-inner">
    <button id="story-close">×</button>
    <h2 id="story-title"></h2>
    <p id="story-body"></p>
  </div>
</div>

<button id="share-btn">
  <span class="btn-label">Share Your Story</span>
  <span class="btn-arrow">✦</span>
</button>

<div id="story-form-overlay">
  <div id="form-card">
    <button id="form-close">×</button>
    <div id="form-progress">
      <span class="step-dot active" data-step="1"></span>
      <span class="step-dot" data-step="2"></span>
      <span class="step-dot" data-step="3"></span>
      <span class="step-dot" data-step="4"></span>
    </div>
    <div id="form-well">

      <!-- Step 1 — Name -->
      <div class="form-step active" data-step="1">
        <div class="form-prompt" id="prompt-1"></div>
        <input id="field-name" type="text" class="form-field" placeholder="your name…" autocomplete="off" />
        <div class="form-nav">
          <button class="next-btn" data-next="2">Continue →</button>
        </div>
      </div>

      <!-- Step 2 — Story -->
      <div class="form-step" data-step="2">
        <div class="form-prompt" id="prompt-2"></div>
        <textarea id="field-body" class="form-field form-textarea" placeholder="I use AI to…"></textarea>
        <div class="form-nav">
          <button class="back-btn" data-back="1">← Back</button>
          <button class="next-btn" data-next="3">Continue →</button>
        </div>
      </div>

      <!-- Step 3 — Title (optional) -->
      <div class="form-step" data-step="3">
        <div class="form-prompt" id="prompt-3"></div>
        <input id="field-title" type="text" class="form-field" placeholder="a title…" autocomplete="off" />
        <div class="form-nav">
          <button class="back-btn" data-back="2">← Back</button>
          <button class="next-btn" data-next="4">Preview →</button>
        </div>
      </div>

      <!-- Step 4 — Preview + submit -->
      <div class="form-step" data-step="4">
        <div class="form-prompt" id="prompt-4"></div>
        <div id="story-preview-card">
          <div id="preview-title-display"></div>
          <div id="preview-body-display"></div>
          <div id="preview-author-display"></div>
        </div>
        <div class="form-nav center">
          <button class="back-btn" data-back="3">← Edit</button>
          <button id="submit-story-btn">Add my story to the canvas ✦</button>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<script>
new p5(p => {
  'use strict';

  // Cotton watercolour paper — warm off-white
  const PR = 242, PG = 237, PB = 225;

  const COLORS = [
    [190, 118, 98 ],  // soft terracotta
    [108, 135, 178],  // muted cornflower
    [198, 162, 95 ],  // muted ochre
    [100, 148, 120],  // soft sage
    [195, 148, 175],  // soft mauve
  ];

  const cursorEl = document.getElementById('cursor');
  let W, H;

  const mouse = { x: -9999, y: -9999 };
  let balls  = [];
  let simT   = 0;
  let mode   = 'freeform'; // 'freeform' | 'transitioning' | 'grid'

  // ── WEIGHTED RANDOM ──────────────────────────────────────────────────────────
  // Biases values toward 0.5 — midpoint of an edge is more likely than the ends.
  // Matches the distribute() in the user's original watercolour code.
  function wrand() {
    const x = p.random();
    return Math.pow((x - 0.5) * 1.58740105, 3) + 0.5;
  }

  // ── POLYGON GROW (the core watercolour algorithm) ────────────────────────────
  // Subdivides every edge: keeps the original vertex, then inserts a new midpoint
  // displaced perpendicular to the edge by a fraction of its length.
  // Repeated calls produce organic, fractal-like blobs that look like wet paint.
  function growPoly({ verts, mods }) {
    const newV = [], newM = [];
    const n    = verts.length;
    const clamp = m => Math.min(0.92, Math.max(0.05, m + (wrand() - 0.5) * 0.12));

    for (let i = 0; i < n; i++) {
      const j   = (i + 1) % n;
      const v1  = verts[i], v2 = verts[j];
      const mod = mods[i];

      // Original vertex stays
      newV.push({ x: v1.x, y: v1.y });
      newM.push(clamp(mod));

      // Displaced midpoint
      const sx   = v2.x - v1.x,  sy   = v2.y - v1.y;
      const len  = Math.hypot(sx, sy);
      const t    = wrand();                                  // biased along edge
      let   mx   = v1.x + sx * t, my = v1.y + sy * t;
      const perp = Math.atan2(sy, sx) - Math.PI / 2 + (wrand() - 0.5) * Math.PI / 4;
      const disp = wrand() * len * 0.5 * mod;               // scale by modifier
      mx += Math.cos(perp) * disp;
      my += Math.sin(perp) * disp;

      newV.push({ x: mx, y: my });
      newM.push(clamp(mod));
    }
    return { verts: newV, mods: newM };
  }

  // Use catmull-rom splines instead of straight edges — grown polygon vertices
  // become smooth curves, giving the soft continuous edge of a real paint wash.
  function drawPoly({ verts }) {
    const n = verts.length;
    p.beginShape();
    p.curveVertex(verts[n - 1].x, verts[n - 1].y); // phantom start
    for (const { x, y } of verts) p.curveVertex(x, y);
    p.curveVertex(verts[0].x, verts[0].y);          // phantom end (close)
    p.curveVertex(verts[1].x, verts[1].y);
    p.endShape();
  }

  // ── FLOW FIELD ───────────────────────────────────────────────────────────────
  function flowAngle(x, y, t) {
    return (
      Math.sin(x * 0.0028 + t * 0.22) * Math.cos(y * 0.0022 + t * 0.18) +
      Math.cos(x * 0.0018 - y * 0.0024 + t * 0.14) * 0.55 +
      Math.sin(x * 0.004  + y * 0.003  + t * 0.30) * 0.3
    ) * Math.PI;
  }

  // ── BALL ─────────────────────────────────────────────────────────────────────
  class Ball {
    constructor(i) {
      const ang    = (i / 50) * Math.PI * 2 + Math.random() * 0.9;
      const spread = 0.18 + Math.random() * 0.62;
      this.x  = W * 0.5 + Math.cos(ang) * W * spread;
      this.y  = H * 0.5 + Math.sin(ang) * H * spread * 0.75;
      this.vx = (Math.random() - 0.5) * 0.3;
      this.vy = (Math.random() - 0.5) * 0.3;
      this.color  = COLORS[i % COLORS.length];
      this.phase  = Math.random() * Math.PI * 2;
      this.wobble = 0.35 + Math.random() * 0.9;
      this.pulseT = Math.random() * Math.PI * 2;
      this.baseR  = 48;
      this.r      = this.baseR;
    }

    tick(t, mx, my) {
      this.pulseT += 0.010;
      this.r = this.baseR * (1 + Math.sin(this.pulseT) * 0.010);

      // Flow field
      const angle = flowAngle(this.x, this.y, t + this.phase * 0.4);
      const fMag  = 0.010 * this.wobble;
      this.vx += Math.cos(angle) * fMag;
      this.vy += Math.sin(angle) * fMag;

      // Mouse repulsion
      const dx = this.x - mx, dy = this.y - my;
      const md = Math.hypot(dx, dy);
      if (md < 220 && md > 0.5) {
        const f = ((220 - md) / 220) ** 2.2;
        this.vx += (dx / md) * f;
        this.vy += (dy / md) * f;
      }

      // Soft centre gravity
      const cd   = Math.hypot(this.x - W * 0.5, this.y - H * 0.5);
      const maxD = Math.min(W, H) * 0.68;
      if (cd > maxD) {
        const pull = (cd - maxD) * 0.00026;
        this.vx += (W * 0.5 - this.x) / cd * pull;
        this.vy += (H * 0.5 - this.y) / cd * pull;
      }

      // Heavy fluid damping — viscous, like pigment in water
      this.vx *= 0.970;
      this.vy *= 0.970;
      const spd = Math.hypot(this.vx, this.vy);
      if (spd > 2.0) { this.vx = this.vx / spd * 2.0; this.vy = this.vy / spd * 2.0; }

      this.x += this.vx;
      this.y += this.vy;

      // Soft wall push
      const pad = this.r * 0.4;
      if (this.x < pad)      this.vx += (pad - this.x)       * 0.06;
      if (this.x > W - pad)  this.vx -= (this.x - (W - pad)) * 0.06;
      if (this.y < pad)      this.vy += (pad - this.y)        * 0.06;
      if (this.y > H - pad)  this.vy -= (this.y - (H - pad)) * 0.06;
    }
  }

  // ── COLLISION ────────────────────────────────────────────────────────────────
  function resolveAll() {
    for (let i = 0; i < balls.length; i++) {
      for (let j = i + 1; j < balls.length; j++) {
        const a = balls[i], b = balls[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const dist = Math.hypot(dx, dy) || 0.001;
        const minD = a.r + b.r + 4;
        if (dist >= minD) continue;
        const nx = dx / dist, ny = dy / dist;
        const ov = (minD - dist) * 0.5;
        a.x -= nx * ov; a.y -= ny * ov;
        b.x += nx * ov; b.y += ny * ov;
        const dv = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
        if (dv > 0) continue;
        const imp = dv * 0.25;
        a.vx -= imp * nx; a.vy -= imp * ny;
        b.vx += imp * nx; b.vy += imp * ny;
      }
    }
  }

  // ── SCATTER ──────────────────────────────────────────────────────────────────
  function scatter(cx, cy) {
    balls.forEach(b => {
      const dx = b.x - cx, dy = b.y - cy;
      const d  = Math.hypot(dx, dy) || 0.5;
      const R  = 460;
      if (d < R) {
        const f = ((R - d) / R) ** 1.5 * 5.0;
        b.vx += (dx / d) * f;
        b.vy += (dy / d) * f;
      }
    });
  }

  // ── WATERCOLOUR RENDER ───────────────────────────────────────────────────────
  function renderWatercolour(ball) {
    const [rv, gv, bv] = ball.color;

    // 16 transparent layers
    const numLayers  = 16;
    const layerAlpha = 2; // scaled down ~4× to compensate for the slower canvas fade

    p.fill(rv, gv, bv, layerAlpha);
    p.noStroke();

    // Octagon starting shape centred on ball
    const n     = 8;
    const verts = Array.from({ length: n }, (_, i) => {
      const a = (i / n) * Math.PI * 2;
      return { x: ball.x + Math.cos(a) * ball.r,
               y: ball.y + Math.sin(a) * ball.r };
    });
    const mods = Array.from({ length: n }, () => p.random(0.32, 0.90));

    // Two initial grows — 8 → 16 → 32 verts
    let poly = growPoly(growPoly({ verts, mods }));

    for (let i = 0; i < numLayers; i++) {
      if (i === Math.floor(numLayers / 2)) {
        poly = growPoly(poly); // 32 → 64 verts mid-loop
      }
      drawPoly(growPoly(poly));
    }
  }

  // ── GRID LAYOUT ──────────────────────────────────────────────────────────────
  function computeGridPositions() {
    const cols = 9, rows = 5;
    const padX = W * 0.10, padY = H * 0.15;
    const positions = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        positions.push({
          x: padX + (c / (cols - 1)) * (W - padX * 2),
          y: padY + (r / (rows - 1)) * (H - padY * 2),
        });
      }
    }
    return positions;
  }

  // ── STORY ────────────────────────────────────────────────────────────────────
  const storyPanel  = document.getElementById('story-panel');
  const storyTitle  = document.getElementById('story-title');
  const storyBody   = document.getElementById('story-body');
  const blobTooltip = document.getElementById('blob-tooltip');
  const tipTitle    = document.getElementById('tip-title');
  const tipBody     = document.getElementById('tip-body');
  let   hoveredBlob = -1;

  const stories = Array.from({ length: 45 }, (_, i) => ({
    title: `Story ${i + 1}`,
    body: 'This story is coming soon.',
    isPlaceholder: true,
  }));

  function openStory(i) {
    storyTitle.textContent = stories[i].title;
    storyBody.textContent  = stories[i].body;
    storyPanel.classList.add('open');
  }

  document.getElementById('story-close').addEventListener('click', () => {
    storyPanel.classList.remove('open');
  });
  storyPanel.addEventListener('click', e => {
    if (e.target === storyPanel) storyPanel.classList.remove('open');
  });

  // ── SETUP & DRAW ─────────────────────────────────────────────────────────────
  p.setup = () => {
    W = window.innerWidth;
    H = window.innerHeight;
    p.createCanvas(W, H);
    p.background(PR, PG, PB);  // begin with blank paper

    balls = Array.from({ length: 45 }, (_, i) => new Ball(i));

    // Pre-warm: settle physics before first render
    for (let i = 0; i < 500; i++) {
      balls.forEach(b => b.tick(i * 0.001, -9999, -9999));
      for (let s = 0; s < 3; s++) resolveAll();
    }
  };

  p.windowResized = () => {
    W = window.innerWidth; H = window.innerHeight;
    p.resizeCanvas(W, H);
    p.background(PR, PG, PB);
  };

  p.draw = () => {
    // ① Wet paper fade ─────────────────────────────────────────────────────────
    // Instead of clearing the canvas, we bleed it back toward the paper colour
    // at a low alpha. Old paint slowly "dries out", leaving ghostly impressions
    // that last ~20 frames — the visual memory of where paint has been.
    p.blendMode(p.BLEND);
    p.noStroke();
    p.fill(PR, PG, PB, 6);    // alpha 6 ≈ 100-frame drying trail (~1.6 s)
    p.rect(0, 0, W, H);

    // ② Physics step
    if (mode === 'freeform') {
      simT += 0.001;
      balls.forEach(b => b.tick(simT, mouse.x, mouse.y));
      for (let s = 0; s < 3; s++) resolveAll();
    } else {
      // Lerp toward grid targets
      let settled = true;
      balls.forEach(b => {
        const dx = b.tx - b.x, dy = b.ty - b.y;
        b.x += dx * 0.05;
        b.y += dy * 0.05;
        b.vx = 0; b.vy = 0;
        if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) settled = false;
      });
      if (mode === 'transitioning' && settled) {
        mode = 'grid';
        document.body.classList.add('grid-mode');
      }
    }

    // ③ Pigment — MULTIPLY blend makes overlapping colours mix like real paint.
    // Red + blue → muddy purple/brown, just like pigments on wet paper.
    p.blendMode(p.MULTIPLY);
    balls.forEach(b => renderWatercolour(b));

  };

  // ── INPUT ─────────────────────────────────────────────────────────────────────
  document.addEventListener('mousemove', e => {
    mouse.x = e.clientX; mouse.y = e.clientY;
    cursorEl.style.left = e.clientX + 'px';
    cursorEl.style.top  = e.clientY + 'px';

    if (mode === 'grid') {
      const hit = balls.findIndex(b =>
        Math.hypot(b.x - e.clientX, b.y - e.clientY) < b.r
      );
      if (hit !== hoveredBlob) {
        hoveredBlob = hit;
        if (hit !== -1) {
          tipTitle.textContent = stories[hit].title;
          blobTooltip.classList.add('visible');
        } else {
          blobTooltip.classList.remove('visible');
        }
      }
      if (hit !== -1) {
        // Position above the blob, clamped to viewport
        const x = Math.min(e.clientX + 14, W - 220);
        const y = Math.max(e.clientY - 80, 8);
        blobTooltip.style.left = x + 'px';
        blobTooltip.style.top  = y + 'px';
      }
    } else {
      if (hoveredBlob !== -1) {
        hoveredBlob = -1;
        blobTooltip.classList.remove('visible');
      }
    }
  });
  document.addEventListener('mousedown', () => cursorEl.classList.add('big'));
  document.addEventListener('mouseup',   () => cursorEl.classList.remove('big'));
  document.addEventListener('click', e => {
    if (mode === 'freeform') {
      scatter(e.clientX, e.clientY);
    } else if (mode === 'grid') {
      const hit = balls.findIndex(b =>
        Math.hypot(b.x - e.clientX, b.y - e.clientY) < b.r
      );
      if (hit !== -1) openStory(hit);
    }
  });
  document.addEventListener('touchmove', e => {
    const t = e.touches[0]; mouse.x = t.clientX; mouse.y = t.clientY;
  }, { passive: true });
  document.addEventListener('touchstart', e => {
    const t = e.touches[0];
    if (mode === 'freeform') scatter(t.clientX, t.clientY);
  }, { passive: true });

  document.getElementById('enter-btn').addEventListener('click', e => {
    e.preventDefault();
    e.stopPropagation();
    if (mode !== 'freeform') return;
    mode = 'transitioning';
    const targets = computeGridPositions();
    balls.forEach((b, i) => { b.tx = targets[i].x; b.ty = targets[i].y; });
    document.getElementById('enter-btn').style.opacity = '0';
    document.getElementById('enter-btn').style.pointerEvents = 'none';
    setTimeout(() => {
      const shareBtn = document.getElementById('share-btn');
      shareBtn.style.display = 'flex';
      requestAnimationFrame(() => requestAnimationFrame(() => shareBtn.classList.add('visible')));
    }, 1600);
  });

  // ── TYPEWRITER ────────────────────────────────────────────────────────────────
  function typewriter(el, text, onDone) {
    el.innerHTML = '';
    const caret = document.createElement('span');
    caret.className = 'caret';
    el.appendChild(caret);
    let i = 0;
    const BASE = 36;
    function tick() {
      if (i < text.length) {
        el.insertBefore(document.createTextNode(text[i]), caret);
        i++;
        const ch = text[i - 1];
        const delay = /[.,?!—]/.test(ch) ? BASE * 5 : BASE + (Math.random() - 0.5) * 14;
        setTimeout(tick, delay);
      } else {
        caret.remove();
        if (onDone) onDone();
      }
    }
    tick();
  }

  // ── MULTI-STEP FORM ───────────────────────────────────────────────────────────
  const overlay   = document.getElementById('story-form-overlay');
  const formSteps = document.querySelectorAll('.form-step');
  const stepDots  = document.querySelectorAll('.step-dot');
  const PROMPTS   = [
    null,
    "What's your name?",
    "How do you use AI?",
    "Give it a title.",
    "Here's your story.",
  ];
  const TITLE_SUGGESTIONS = [
    "How AI became my quiet collaborator",
    "The hour I get back every day",
    "A new kind of thinking partner",
    "Finding flow with a little help",
  ];
  let currentStep = 1;

  function showStep(n) {
    const prev = document.querySelector('.form-step.active');
    const next = document.querySelector(`.form-step[data-step="${n}"]`);
    if (!next || next === prev) return;
    currentStep = n;

    const doShow = () => {
      if (prev) {
        prev.classList.remove('active');
        prev.style.opacity = '';
        prev.style.display = 'none';
      }
      next.style.opacity = '0';
      next.style.display = 'flex';
      requestAnimationFrame(() => requestAnimationFrame(() => {
        next.classList.add('active');
        next.style.opacity = '1';
      }));
      stepDots.forEach(d => d.classList.toggle('active', +d.dataset.step === n));
      const promptEl = document.getElementById(`prompt-${n}`);
      if (promptEl && PROMPTS[n]) typewriter(promptEl, PROMPTS[n]);
      const field = next.querySelector('.form-field');
      if (field) setTimeout(() => field.focus(), 350);
    };

    if (prev) {
      prev.style.opacity = '0';
      setTimeout(doShow, 300);
    } else {
      doShow();
    }
  }

  // ── NAV ───────────────────────────────────────────────────────────────────────
  document.querySelectorAll('.next-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const next = +btn.dataset.next;
      if (currentStep === 1 && !document.getElementById('field-name').value.trim()) {
        document.getElementById('field-name').focus(); return;
      }
      if (currentStep === 2 && !document.getElementById('field-body').value.trim()) {
        document.getElementById('field-body').focus(); return;
      }
      if (next === 4) populatePreview();
      showStep(next, 'forward');
    });
  });

  document.querySelectorAll('.back-btn').forEach(btn => {
    btn.addEventListener('click', () => showStep(+btn.dataset.back, 'backward'));
  });

  ['field-name', 'field-title'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const nextBtn = document.querySelector('.form-step.active .next-btn');
        if (nextBtn) nextBtn.click();
      }
    });
  });

  // ── PREVIEW ───────────────────────────────────────────────────────────────────
  function populatePreview() {
    const name  = document.getElementById('field-name').value.trim();
    const body  = document.getElementById('field-body').value.trim();
    let   title = document.getElementById('field-title').value.trim();
    if (!title) {
      const words = body.split(/\s+/).slice(0, 6).join(' ');
      title = words.split(/\s+/).length > 3
        ? words + (words.endsWith('.') ? '' : '…')
        : TITLE_SUGGESTIONS[Math.floor(Math.random() * TITLE_SUGGESTIONS.length)];
      document.getElementById('field-title').value = title;
    }
    document.getElementById('preview-title-display').textContent  = title;
    document.getElementById('preview-body-display').textContent   = body;
    document.getElementById('preview-author-display').textContent = `— ${name}`;
  }

  // ── BLOB FLASH ────────────────────────────────────────────────────────────────
  function flashBlob(idx) {
    const b = balls[idx];
    if (!b) return;
    const origR = b.baseR;
    b.baseR = origR * 1.65;
    let t = 0;
    const spring = setInterval(() => {
      t++;
      b.baseR = origR * (1.65 - 0.65 * (t / 22));
      if (t >= 22) { b.baseR = origR; clearInterval(spring); }
    }, 28);
  }

  // ── SPAWN NEW BALL (overflow: all 45 slots filled) ───────────────────────────
  function spawnNewBall(title, body, name) {
    const newIdx = balls.length;
    const nb     = new Ball(newIdx);
    nb.x = W * 0.5 + (Math.random() - 0.5) * 60;
    nb.y = H + 90;
    nb.color = COLORS[newIdx % COLORS.length];
    const angle = Math.random() * Math.PI * 2;
    nb.tx = W * 0.5 + Math.cos(angle) * Math.min(W, H) * 0.28;
    nb.ty = H * 0.5 + Math.sin(angle) * Math.min(W, H) * 0.28;
    nb.vx = 0; nb.vy = -2.5;
    balls.push(nb);
    stories.push({ title, body: body + '\n\n— ' + name, isPlaceholder: false });
    if (mode === 'grid') {
      mode = 'transitioning';
      setTimeout(() => { mode = 'grid'; }, 2200);
    }
  }

  // ── SUBMIT ────────────────────────────────────────────────────────────────────
  document.getElementById('submit-story-btn').addEventListener('click', () => {
    const submitBtn = document.getElementById('submit-story-btn');
    const name      = document.getElementById('field-name').value.trim();
    const body      = document.getElementById('field-body').value.trim();
    const title     = document.getElementById('field-title').value.trim()
                    || document.getElementById('preview-title-display').textContent;

    const slotIndex = stories.findIndex(s => s.isPlaceholder);
    if (slotIndex !== -1) {
      stories[slotIndex] = { title, body: body + '\n\n— ' + name, isPlaceholder: false };
      flashBlob(slotIndex);
    } else {
      spawnNewBall(title, body, name);
    }

    submitBtn.classList.add('submitting');
    submitBtn.textContent = 'Finding its place…';

    setTimeout(() => {
      submitBtn.classList.remove('submitting');
      submitBtn.textContent = 'Add my story to the canvas ✦';
      closeOverlay();
    }, 1900);
  });

  // ── OVERLAY OPEN / CLOSE ──────────────────────────────────────────────────────
  function openOverlay() {
    currentStep = 1;
    document.getElementById('field-name').value  = '';
    document.getElementById('field-body').value  = '';
    document.getElementById('field-title').value = '';
    formSteps.forEach(s => {
      s.classList.remove('active');
      s.style.display = 'none';
      s.style.opacity = '';
    });
    document.querySelectorAll('.form-prompt').forEach(el => el.innerHTML = '');
    p.noLoop();
    overlay.classList.add('open');
    setTimeout(() => showStep(1), 320);
  }

  function closeOverlay() {
    overlay.classList.remove('open');
    setTimeout(() => { p.loop(); }, 420);
  }

  document.getElementById('share-btn').addEventListener('click', openOverlay);
  document.getElementById('form-close').addEventListener('click', closeOverlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeOverlay(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeOverlay();
  });
});
</script>
</body>
</html>
